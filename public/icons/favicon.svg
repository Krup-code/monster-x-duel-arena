<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>MONSTER-X</title>
  <!-- Original MONSTER-X emblem: hex badge + an X built from two serrated blades.
       Geometry mirrors drawXEmblem() in src/textures.js (center 32,32, s = 23). -->
  <defs>
    <linearGradient id="mx-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16191a"/>
      <stop offset="1" stop-color="#050605"/>
    </linearGradient>
    <radialGradient id="mx-halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7dff1a" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#7dff1a" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#7dff1a" stop-opacity="0"/>
    </radialGradient>
    <filter id="mx-glow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.3" result="blur"/>
      <feComponentTransfer in="blur" result="soft">
        <feFuncA type="linear" slope="0.75"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="soft"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="14" ry="14" fill="url(#mx-bg)"/>
  <circle cx="32" cy="32" r="27" fill="url(#mx-halo)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="13.25" ry="13.25" fill="none" stroke="#2a2f31" stroke-width="1.5"/>

  <g filter="url(#mx-glow)">
    <polygon points="51.92,43.50 32,55 12.08,43.50 12.08,20.50 32,9 51.92,20.50"
             fill="none" stroke="#7dff1a" stroke-width="2.6" stroke-linejoin="miter" stroke-miterlimit="4"/>
    <polygon fill="#7dff1a"
             points="17.74,15.90 23.72,15.90 29.70,25.56 31.54,23.26 33.84,29.24 46.26,48.10 40.28,48.10 33.84,37.52 31.54,39.82 29.70,34.30"/>
    <polygon fill="#7dff1a"
             points="46.26,15.90 40.28,15.90 34.30,25.56 32.46,23.26 30.16,29.24 17.74,48.10 23.72,48.10 30.16,37.52 32.46,39.82 34.30,34.30"/>
  </g>

  <!-- faint white specular along the top edge of the badge -->
  <path d="M14 7.5 H50" stroke="#f2f5f0" stroke-opacity="0.10" stroke-width="1" stroke-linecap="round"/>
</svg>
