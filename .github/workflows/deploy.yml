# Deploy MONSTER-X: DUEL ARENA to GitHub Pages.
#
# One-time setup:
#   1. Push this repository to GitHub with `main` as the default branch.
#   2. Repository Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
#   3. Optional: Settings -> Secrets and variables -> Actions -> add any VITE_* value from
#      .env.example as a repository *variable* (or a secret - either works, variables win).
#      Leave everything unset for the zero-config PeerJS public broker.
#   4. Push to main, or run this workflow by hand from the Actions tab ("Run workflow").
#
# The game is served from https://<user>.github.io/<repo>/ . vite.config.js uses a relative
# base ('./'), so no repository name has to be configured; set the VITE_BASE variable only if
# you need an absolute base (for example a custom domain sub-path).

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a deployment that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_BASE: ${{ vars.VITE_BASE || secrets.VITE_BASE }}
          VITE_SIGNALING: ${{ vars.VITE_SIGNALING || secrets.VITE_SIGNALING }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ vars.VITE_FIREBASE_DATABASE_URL || secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || secrets.VITE_FIREBASE_APP_ID }}
          VITE_TURN_URLS: ${{ vars.VITE_TURN_URLS || secrets.VITE_TURN_URLS }}
          VITE_TURN_USERNAME: ${{ vars.VITE_TURN_USERNAME || secrets.VITE_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ vars.VITE_TURN_CREDENTIAL || secrets.VITE_TURN_CREDENTIAL }}
          VITE_PEERJS_HOST: ${{ vars.VITE_PEERJS_HOST || secrets.VITE_PEERJS_HOST }}
          VITE_PEERJS_PORT: ${{ vars.VITE_PEERJS_PORT || secrets.VITE_PEERJS_PORT }}
          VITE_PEERJS_PATH: ${{ vars.VITE_PEERJS_PATH || secrets.VITE_PEERJS_PATH }}
          VITE_PEERJS_KEY: ${{ vars.VITE_PEERJS_KEY || secrets.VITE_PEERJS_KEY }}
          VITE_PEERJS_SECURE: ${{ vars.VITE_PEERJS_SECURE || secrets.VITE_PEERJS_SECURE }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
